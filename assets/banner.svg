<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #818cf8; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }

      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.8; }
        50% { transform: translateY(140px); opacity: 0.4; }
        100% { transform: translateY(0px); opacity: 0.8; }
      }

      .floating-element { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
      .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .scanner { animation: scanLine 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  
  <!-- Glowing background dynamic circles -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-bg"/>
  <circle cx="1050" cy="220" r="200" fill="#ec4899" opacity="0.12" filter="url(#glow)" class="pulse-bg" style="animation-delay: -2s;"/>

  <!-- Background Animated Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Dynamic Background Graphics (Doc Scan / IDP Visualization - strictly kept in background) -->
  <g class="floating-element" opacity="0.25">
    <!-- Abstract Document Card back right -->
    <rect x="920" y="40" width="180" height="220" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="940" y="70" width="100" height="12" rx="4" fill="#6366f1"/>
    <rect x="940" y="95" width="140" height="8" rx="3" fill="#475569"/>
    <rect x="940" y="115" width="120" height="8" rx="3" fill="#475569"/>
    <rect x="940" y="135" width="130" height="8" rx="3" fill="#475569"/>
    <rect x="940" y="165" width="60" height="24" rx="4" fill="#a855f7"/>
    <!-- Laser scanner effect -->
    <line x1="910" y1="80" x2="1110" y2="80" stroke="#ec4899" stroke-width="3" filter="url(#glow)" class="scanner"/>
  </g>

  <!-- Foreground Title and Subtitle Block (Ensured clear visibility) -->
  <g transform="translate(80, 0)">
    <!-- Tag / Pill -->
    <rect x="0" y="52" width="280" height="30" rx="15" fill="#6366f1" opacity="0.2"/>
    <rect x="0" y="52" width="280" height="30" rx="15" fill="none" stroke="#6366f1" stroke-width="1"/>
    <text x="15" y="72" class="badge-text">⚡ AWESOME ECOSYSTEM GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Intelligent Document Processing</text>

    <!-- Gradient Divider Line -->
    <rect x="0" y="155" width="680" height="4" rx="2" fill="url(#accent)"/>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">A curated list of enterprise SaaS platforms, AI models &amp; open-source OCR tools</text>
    <text x="0" y="228" class="subtitle" style="font-size: 16px; fill: #94a3b8;">Document Understanding • Invoice Extraction • Form Parsing • LayoutLM • PaddleOCR</text>
  </g>
</svg>
